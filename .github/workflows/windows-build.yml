name: Windows desktop build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore .\KoaZa.Foreseer.csproj

      - name: Build Release
        run: dotnet build .\KoaZa.Foreseer.csproj --configuration Release --no-restore

      - name: Publish self-contained Windows x64 executable
        run: dotnet publish .\KoaZa.Foreseer.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output .\publish\win-x64

      - name: Package executable
        shell: pwsh
        run: Compress-Archive -Path .\publish\win-x64\* -DestinationPath .\KoaZa-Foreseer-win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoaZa-Foreseer-win-x64
          path: KoaZa-Foreseer-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: KoaZa-Foreseer-win-x64.zip
